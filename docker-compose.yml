services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: myfinance
      POSTGRES_PASSWORD: myfinance
      POSTGRES_DB: myfinance
    ports:
      - "5432:5432"
    volumes:
      - myfinance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinance -d myfinance"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  myfinance_db_data:
